# Experiment configuration. Pin everything here for reproducibility.

domain: telecom               # env/orchestrator/evaluator domain
task_set: telecom_small       # tau2 task set name (small curated set; good for budget)
benchmark_commit: ""          # fill with the tau2-bench-verified commit hash you run
max_steps: 40                # 100 let the agent loop until it overflowed 32k ctx; 40 is
                             # enough to solve a real task and caps transcript length.

subset:
  size: 20                    # cap on tasks from the set (null/large = use all)
  seed: 0

rollout:
  trials: 4                   # trials per task; must be >= eval.k for pass^k
  method: guidance_verify_repair   # one of the 5 in src/methods.METHODS

eval:
  k: 2

# Base agent + user simulator: Qwen on the local vLLM server (LiteLLM openai route).
# Running ON the AutoDL box -> 127.0.0.1:6006. If driving from local via SSH tunnel, use 8000.
base_model:
  model: "Qwen/Qwen2.5-14B-Instruct-AWQ"
  base_url: "http://127.0.0.1:6006/v1"
  api_key: "EMPTY"
  temperature: 0.7            # >0 so k trials differ

# Verifier + repair. For the zero-API smoke test we reuse the SAME local Qwen.
# For the real runs, switch to a stronger model (set model/base_url/api_key, e.g.
# gpt-4o-mini with OPENAI_API_KEY) -- this is the "cheap vs strong verifier" ablation.
verifier_model:
  model: "Qwen/Qwen2.5-14B-Instruct-AWQ"
  base_url: "http://127.0.0.1:6006/v1"
  api_key: "EMPTY"
  temperature: 0.0
  max_tokens: 512

paths:
  rubric: "configs/rubrics/telecom.json"
  cost_log: "results/cost_log.csv"
